version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskhunt
      POSTGRES_PASSWORD: taskhunt
      POSTGRES_DB: taskhunt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskhunt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav-debian:latest
    restart: unless-stopped
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/web/.env
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next

  notifications-service:
    build:
      context: .
      dockerfile: apps/notifications-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/notifications-service/.env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./apps/notifications-service:/app/apps/notifications-service
      - /app/apps/notifications-service/node_modules

  fraud-service:
    build:
      context: .
      dockerfile: apps/fraud-service/Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/fraud-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/fraud-service:/app/apps/fraud-service
      - /app/apps/fraud-service/node_modules

volumes:
  postgres_data:
  redis_data:
