# TaskHunt — nginx reverse-proxy config for a single-host deployment.
#
# ЗАМЕНИТЕ "taskhunt.example" на реальный домен везде в этом файле
# (быстро: sed -i '' 's/taskhunt.example/ваш-домен.ru/g' deploy/nginx/taskhunt.conf).
#
# Топология поддоменов:
#   taskhunt.example       -> apps/web  (Next.js, контейнер :3000)
#   www.taskhunt.example    -> 301 на apex (taskhunt.example)
#   api.taskhunt.example    -> apps/api  (NestJS, контейнер :3001) + WebSocket (Socket.IO чат)
#   admin.taskhunt.example  -> 301 на apex + /admin (админка — это роут /admin
#                               внутри того же Next.js-приложения, не отдельный
#                               сервис, поэтому просто редиректим, а не проксируем
#                               с переписыванием пути — так не ломаются статика/чанки)
#
# Перед первым запуском:
#   1. DNS: A-записи taskhunt.example, www.taskhunt.example, api.taskhunt.example,
#      admin.taskhunt.example -> IP этого сервера.
#   2. certbot (см. docs/DEPLOYMENT.md) выпускает сертификаты на все 4 имени сразу:
#        certbot certonly --nginx -d taskhunt.example -d www.taskhunt.example \
#          -d api.taskhunt.example -d admin.taskhunt.example
#   3. Положить этот файл в /etc/nginx/sites-available/taskhunt.conf,
#      симлинк в sites-enabled, nginx -t && systemctl reload nginx.

# --- HTTP -> HTTPS редирект для всех поддоменов сразу, плюс ACME-челлендж для certbot ---
server {
    listen 80;
    listen [::]:80;
    server_name taskhunt.example www.taskhunt.example api.taskhunt.example admin.taskhunt.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- www -> apex редирект (canonical-домен — apex, без www) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.taskhunt.example;

    ssl_certificate     /etc/letsencrypt/live/taskhunt.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskhunt.example/privkey.pem;

    return 301 https://taskhunt.example$request_uri;
}

# --- admin.taskhunt.example -> apex/admin редирект ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.taskhunt.example;

    ssl_certificate     /etc/letsencrypt/live/taskhunt.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskhunt.example/privkey.pem;

    return 301 https://taskhunt.example/admin$request_uri;
}

# --- apex: фронтенд (Next.js) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name taskhunt.example;

    ssl_certificate     /etc/letsencrypt/live/taskhunt.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskhunt.example/privkey.pem;

    client_max_body_size 15m; # аватарки/файлы заказов идут через API, но с запасом и тут

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- api.taskhunt.example: бэкенд (NestJS) + WebSocket (Socket.IO чат) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.taskhunt.example;

    ssl_certificate     /etc/letsencrypt/live/taskhunt.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskhunt.example/privkey.pem;

    client_max_body_size 15m; # загрузка файлов/аватарок

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO (чат) держит соединение открытым через Upgrade — без этого
        # апгрейд до WebSocket рвётся на прокси и чат тихо падает на polling.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }
}
