# Временный конфиг ТОЛЬКО для первого выпуска сертификатов (см. docs/DEPLOYMENT.md,
# шаг 3). Отдаёт исключительно /.well-known/acme-challenge/ на порту 80 —
# никаких ssl_certificate-директив, поэтому nginx -t проходит даже когда
# сертификатов ещё не существует на диске. После certbot этот файл больше
# не нужен — используется полный deploy/nginx/taskhunt.conf.
#
# ЗАМЕНИТЕ "taskhunt.example" на реальный домен (как и в taskhunt.conf).

server {
    listen 80;
    listen [::]:80;
    server_name taskhunt.example www.taskhunt.example api.taskhunt.example admin.taskhunt.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'TaskHunt: certificate bootstrap in progress.';
        add_header Content-Type text/plain;
    }
}
